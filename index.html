<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241a1f">
  <title>Bougainville Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="menu.css">
  <script src="menu-pages.js"></script>
  <script defer src="menu.js"></script>
</head>
<body>
  <main class="stage" id="stage" aria-label="Menu Bougainville Café Lounge">
    <div class="world" id="world">
      <div class="shadow" aria-hidden="true"></div>
      <div class="rig">
        <div class="book" id="book" role="group" aria-label="Menu Bougainville Café Lounge"></div>
      </div>
    </div>
    <button class="page-arrow previous" id="pagePrev" type="button" aria-label="Page précédente" aria-controls="book" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="page-arrow next" id="pageNext" type="button" aria-label="Page suivante" aria-controls="book">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </main>
  <noscript><p>Activez JavaScript pour feuilleter le menu.</p></noscript>
</body>
</html>
