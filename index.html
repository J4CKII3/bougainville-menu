<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241a1f">
<title>Bougainville Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout concept: a real magazine floating over a taupe backdrop. Leaves hinge on the spine (3D),
   a spread on wide screens, one page with a camera pan on phones. Page styles: Noir, Paper, Poster. */
:root{
  --bg:#857d74;
  --ink:#30251d;
  --charcoal:#2e2925;
  --amber:#e0a75c;
  --gold:#c89a5b;
  --accent:#8a6038;
  --accent-dark:#5c3e2a;
  --paper:#f4eee5;
  --f-slab:'Arvo','Rockwell',Georgia,serif;
  --f-didone:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --f-poster:'Anton','Impact','Haettenschweiler','Arial Narrow Bold',sans-serif;
  --f-sans:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;color:#f3ece6;font-family:var(--f-sans);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage, world, camera ---------- */
.stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:linear-gradient(rgba(54,44,37,.58),rgba(54,44,37,.58)),url("photo2.jpeg") center/cover no-repeat;--tx:5deg;--ty:0deg;--tz:0deg}
.stage.is-wide{--tx:15deg;--ty:-3deg;--tz:-2deg}
.world{position:absolute;left:50%;top:50%;width:calc(var(--pw)*2);height:var(--ph);margin-left:calc(var(--pw)*-1);margin-top:calc(var(--ph)*-.5);
  perspective:2300px;perspective-origin:50% 42%;--shift:0px;--sw:300px}
.stage:not(.is-wide) .world{perspective:1700px}
.shadow{position:absolute;left:50%;top:calc(100% + 10px);width:var(--sw);height:38px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(20,14,10,.55),rgba(20,14,10,0));filter:blur(7px);
  transform:translateX(calc(-50% + var(--shift)));transition:transform .95s cubic-bezier(.45,.05,.2,1),width .95s;animation:shadowb 6s ease-in-out infinite}
@keyframes shadowb{0%,100%{opacity:1;scale:1}50%{opacity:.72;scale:.93}}
.float,.tilt,.rig,.book{position:absolute;inset:0;transform-style:preserve-3d}
.float{animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.tilt{transform:rotateX(var(--tx)) rotateY(var(--ty)) rotateZ(var(--tz));transition:transform .5s ease-out}
.rig{transform:translateX(var(--shift));transition:transform .95s cubic-bezier(.45,.05,.2,1)}

/* page stacks give the book its thickness */
.stack-r,.stack-l{position:absolute;top:0;width:var(--pw);height:var(--ph);background:#efe8dc;transform:translateZ(-1px)}
.stack-r{left:50%;--d:calc(var(--nr)*1.5px)}
.stack-l{right:50%;--d:calc(var(--nl)*1.5px);transition:opacity .45s ease}
.stage.is-front .stack-l{opacity:0;pointer-events:none}
.stack-r::before,.stack-l::before,.stack-r::after,.stack-l::after{content:"";position:absolute;transition:width .95s,height .95s,left .95s,right .95s}
.stack-r::after{left:100%;top:1px;bottom:calc(var(--d)*-1);width:var(--d);background:repeating-linear-gradient(90deg,#c9c0af 0 1px,#f7f2e9 1px 2px)}
.stack-r::before{top:100%;left:0;right:calc(var(--d)*-1);height:var(--d);background:repeating-linear-gradient(180deg,#c9c0af 0 1px,#f7f2e9 1px 2px)}
.stack-l::after{right:100%;top:1px;bottom:calc(var(--d)*-1);width:var(--d);background:repeating-linear-gradient(270deg,#c9c0af 0 1px,#f7f2e9 1px 2px)}
.stack-l::before{top:100%;right:0;left:calc(var(--d)*-1);height:var(--d);background:repeating-linear-gradient(180deg,#c9c0af 0 1px,#f7f2e9 1px 2px)}

/* ---------- leaves and faces ---------- */
.leaf{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);transform-origin:0 50%;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.45,.05,.2,1);transition-delay:var(--d,0ms)}
.face{position:absolute;inset:0;overflow:hidden;container-type:size;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--charcoal)}
.face.l{transform:rotateY(180deg)}
.face::before{content:"";position:absolute;inset:0;z-index:40;pointer-events:none}
.face.r::before{background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.14) 4%,rgba(0,0,0,0) 12%)}
.face.l::before{background:linear-gradient(270deg,rgba(0,0,0,.42),rgba(0,0,0,.14) 4%,rgba(0,0,0,0) 12%)}
.face::after{content:"";position:absolute;inset:0;z-index:41;pointer-events:none;opacity:0;background:rgba(0,0,0,.4);transition:opacity .95s;transition-delay:var(--d,0ms)}
.leaf.flipped .face.r::after{opacity:1}
.leaf:not(.flipped) .face.l::after{opacity:1}
.stage.no-anim *,.stage.no-anim *::before,.stage.no-anim *::after{transition:none!important}
.blank{background:#3a1626}

.scroll{position:absolute;inset:0;z-index:2;overflow:hidden;overscroll-behavior:contain;touch-action:pan-y}
.gut{position:relative;padding-block:34px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{padding-inline:8px;position:relative}
.foot{margin:2.4em 0 0;text-align:center;font:400 10.5px var(--f-sans);letter-spacing:.24em;text-transform:uppercase;opacity:.6}

/* ---------- COVER ---------- */
.cover{background:linear-gradient(165deg,#3a251d 0%,#211713 52%,#120c0d 100%);color:#fff}
.cover-photo{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;opacity:.48;filter:brightness(.62) saturate(.78);pointer-events:none}
.cv-frame{position:absolute;inset:14px;z-index:3;border:1px solid rgba(200,146,58,.65);pointer-events:none}
.cv{min-height:100%;display:flex;flex-direction:column;gap:6px;padding:clamp(20px,4cqh,30px) max(32px,env(safe-area-inset-right,0px)) clamp(20px,4cqh,30px) max(32px,env(safe-area-inset-left,0px))}
.cv-top{text-align:center;font:500 10.5px var(--f-sans);letter-spacing:.34em;text-transform:uppercase;color:#ead9bf}
.cv-mast{margin:.5em 0 0;font:italic 600 clamp(48px,16.5cqw,92px)/.86 var(--f-didone);letter-spacing:-.035em;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.cv-sub{margin:0 0 4px;font:500 13px var(--f-sans);letter-spacing:.62em;text-transform:uppercase;color:var(--amber);padding-left:.2em}
.cv-rule{width:72px;height:2px;flex:none;margin:10px auto 16px;background:var(--gold);box-shadow:0 0 18px rgba(200,154,91,.38)}
.cv-lines{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.cv-line{width:100%;text-align:left;display:grid;grid-template-columns:3.1rem minmax(0,1fr);align-items:baseline;gap:6px;padding:5px 0;border-radius:8px}
.cv-line .pg{font:400 17px var(--f-poster);letter-spacing:.06em;color:var(--amber)}
.cv-line b{display:block;font:600 16px/1.2 var(--f-sans);letter-spacing:.02em}
.cv-line small{display:block;margin-top:2px;font:300 13px var(--f-sans);color:#dbc8b0}
.cv-line.hot b{color:var(--amber);font-size:18px}
.cv-line:hover b{text-decoration:underline;text-underline-offset:3px}
.cv-hint{margin:6px 0 0;display:flex;align-items:center;gap:10px;font:400 11px var(--f-sans);letter-spacing:.2em;text-transform:uppercase;color:#cdb9a0}
.cv-hint i{flex:0 0 38px;height:1px;background:currentColor;position:relative;animation:nudge 1.8s ease-in-out infinite}
.cv-hint i::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}

/* ---------- PHOTO (facade) ---------- */
.photo{background:#241b16;color:#fff}
.ph-img{position:absolute;object-fit:cover}
.ph-img-main{inset:0;width:100%;height:100%;object-position:40% 50%}
.ph-img-detail{z-index:2;right:8%;bottom:22%;width:42%;height:27%;border:5px solid rgba(255,255,255,.92);box-shadow:0 12px 30px rgba(0,0,0,.4);transform:rotate(-4deg)}
.ph-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,6,8,.28) 0%,rgba(10,6,8,0) 22%,rgba(10,6,8,0) 52%,rgba(24,10,18,.9) 100%)}
.ph-txt{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 32px 40px}
.ph-k{margin:0;font:500 11px var(--f-sans);letter-spacing:.42em;text-transform:uppercase;color:var(--amber)}
.ph-t{margin:.15em 0 .1em;font:italic 600 clamp(48px,17cqw,84px)/.95 var(--f-didone);letter-spacing:-.03em;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.ph-s{margin:0;font:300 14px var(--f-sans);letter-spacing:.2em;text-transform:uppercase;color:#f0e2cf}

/* ---------- MENU PHOTOGRAPHY ---------- */
.menu-art{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.3;filter:saturate(.88);pointer-events:none;user-select:none}
.noir .menu-art{opacity:.28;filter:brightness(.72) saturate(.82)}
.paper .menu-art{opacity:.22;filter:saturate(.78)}
.poster .menu-art{opacity:.34;filter:brightness(.72) saturate(.85)}

/* ---------- NOIR ---------- */
.noir{background:radial-gradient(120% 55% at 100% 0%,rgba(227,154,45,.11),transparent 60%),var(--charcoal);color:#f2ebe3}
.ghost{position:absolute;right:-6px;top:-4px;z-index:0;font:700 clamp(120px,38cqw,200px)/1 var(--f-slab);color:transparent;-webkit-text-stroke:1.5px rgba(227,154,45,.2);pointer-events:none;user-select:none}
.n-kick{margin:0;font:500 11.5px var(--f-sans);letter-spacing:.34em;text-transform:uppercase;color:#bfb4a8}
.n-title{margin:.25em 0 .35em;max-width:11em;font:700 clamp(28px,8.8cqw,42px)/1.08 var(--f-slab);color:var(--amber);text-wrap:balance}
.n-group h3{display:flex;align-items:center;gap:.6em;margin:1.2em 0 .5em;font:400 20px var(--f-slab);color:var(--amber)}
.n-group h3::before{content:"";width:8px;height:8px;flex:none;border-radius:50%;background:var(--gold)}
.n-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,auto) minmax(14px,1fr) auto;align-items:end;gap:.55rem}
.noir .nm{font:400 15.5px/1.25 var(--f-sans);letter-spacing:.02em}
.lead{margin-bottom:.4em;border-bottom:2px dotted rgba(243,236,230,.3)}
.noir .pr{font:500 15.5px var(--f-sans);color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.noir .dsc{margin:.2em 0 0;max-width:34em;font:300 12.5px/1.4 var(--f-sans);color:#c3b9ae}
.noir .tag{display:inline-block;margin:.5em 0 0;padding:.2em .8em;border-radius:99px;background:var(--amber);color:#2a1d0c;font:600 12px var(--f-sans);letter-spacing:.06em}

/* ---------- PAPER ---------- */
.paper{background:var(--paper);color:var(--ink)}
.paper .gut{padding-top:40px}
.b-kick{margin:0;font:500 11.5px var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:var(--accent-dark)}
.b-kick span{font:italic 500 18px var(--f-didone);letter-spacing:0;margin-right:.5em}
.b-title{margin:.2em 0 .12em;font:italic 500 clamp(42px,12.4cqw,64px)/.96 var(--f-didone);letter-spacing:-.025em;text-wrap:balance}
.b-title em{color:var(--accent)}
.b-lede{margin:.5em 0 0;max-width:30ch;font:300 15.5px/1.55 var(--f-sans);color:#5b4a3d}
.b-lede::first-letter{float:left;margin:.04em .09em 0 0;font:italic 600 3.1em/.8 var(--f-didone);color:var(--accent)}
.b-group h3{margin:1.5em 0 .5em;font:600 12px var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:var(--accent-dark)}
.b-list{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.b-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline}
.paper .nm{font:500 15.5px/1.25 var(--f-sans);letter-spacing:.01em}
.paper .dsc{display:block;margin-top:.15em;font:300 12.5px/1.4 var(--f-sans);color:#6a5a4d}
.paper .tag{display:inline-block;margin-top:.5em;padding:.2em .8em;border-radius:99px;background:var(--accent-dark);color:#fff;font:600 12px var(--f-sans);letter-spacing:.06em}
.paper .pr{white-space:nowrap;color:var(--accent-dark);font:italic 600 30px/1 var(--f-didone);font-variant-numeric:lining-nums}
.paper .pr sup{font-size:.5em;vertical-align:.7em;margin-left:1px}
.b-feature{margin:2em 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-radius:18px;background:var(--accent-dark);color:#fff}
.b-feature .bf-l{font:italic 500 25px/1.1 var(--f-didone)}
.b-feature .bf-p{font:italic 600 42px/1 var(--f-didone);white-space:nowrap}
.b-feature .bf-p sup{font-size:.45em;vertical-align:.85em}
.b-note{margin:1.2em 0 0;font:italic 500 17px var(--f-didone);color:var(--accent-dark)}
.toc{list-style:none;margin:1.6em 0 0;padding:0;display:grid;gap:2px}
.toc-it{width:100%;display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:8px 0;border-radius:10px}
.toc-n{font:italic 500 30px/1 var(--f-didone);color:var(--accent-dark)}
.toc-t b{display:block;font:500 16.5px/1.25 var(--f-sans)}
.toc-t small{display:block;margin-top:1px;font:300 12.5px var(--f-sans);color:#6a5560}
.toc-a{font:300 26px var(--f-sans);color:var(--accent-dark);transition:transform .2s}
.toc-it:hover .toc-a{transform:translateX(5px)}
.toc-it:hover .toc-t b{color:var(--accent-dark)}

/* ---------- POSTER ---------- */
.poster{background:var(--pbg);color:var(--pfg)}
.poster .scroll{background:linear-gradient(180deg,rgba(43,31,24,.24),rgba(43,31,24,.56))}
.p-kick{position:relative;margin:0;font:500 11.5px var(--f-sans);letter-spacing:.32em;text-transform:uppercase;opacity:.9}
.p-title{position:relative;margin:.22em 0 .08em;font:400 clamp(42px,14cqw,76px)/.92 var(--f-poster);text-transform:uppercase;letter-spacing:.005em}
.p-title span{display:block}
.p-title .o{color:transparent;-webkit-text-stroke:2px var(--pfg)}
.p-group h3{position:relative;display:inline-block;margin:1em 0 .5em;padding:.12em .65em .05em;background:var(--pchipbg);color:var(--pchipfg);font:400 18px/1.2 var(--f-poster);letter-spacing:.07em;text-transform:uppercase;transform:rotate(-2deg)}
.p-list{position:relative;list-style:none;margin:0;padding:0;display:grid;gap:6px}
.p-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.poster .nm{display:block;font:500 14.5px/1.2 var(--f-sans);letter-spacing:.05em;text-transform:uppercase}
.poster .dsc{display:block;margin-top:.12em;font:300 12px/1.35 var(--f-sans);opacity:.88;letter-spacing:.02em}
.poster .pr{padding:.1em .65em 0;border-radius:99px;background:var(--pchipbg);color:var(--pchipfg);font:400 19px/1.3 var(--f-poster);letter-spacing:.03em;white-space:nowrap}
.p-note{position:relative;margin:1.4em 0 0;display:inline-block;padding:.3em .9em;border:2px solid var(--pfg);border-radius:99px;font:500 13px var(--f-sans);letter-spacing:.12em;text-transform:uppercase}

/* ---------- CHICHA ---------- */
.chicha{background:radial-gradient(85% 55% at 30% 68%,#756d63 0%,#403a35 52%,#1a1614 100%);color:#fff}
.smoke{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.c-frame{position:absolute;inset:14px;z-index:3;border:1.5px solid var(--gold);pointer-events:none;opacity:.8}
.chicha .gut{padding-top:32px;padding-bottom:28px;text-align:center}
.c-brand{margin:0;font:italic 600 24px/1 var(--f-didone);letter-spacing:-.01em}
.c-brand small{display:block;margin-top:3px;font:500 10.5px var(--f-sans);letter-spacing:.5em;text-transform:uppercase;color:var(--gold);font-style:normal}
.c-offre{margin:.5em 0 0;display:inline-block;font:400 clamp(34px,min(12cqw,6.2cqh),68px)/1 var(--f-poster);letter-spacing:.01em;text-transform:uppercase;transform:skewX(-8deg);background:linear-gradient(180deg,#ffe0a0 0%,#e8a43a 55%,#b86e14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.c-price{margin:-.02em 0 0;display:flex;justify-content:center;align-items:baseline;gap:.1em;font:400 clamp(90px,min(32cqw,16cqh),164px)/.95 var(--f-poster);transform:skewX(-8deg);color:#fff;-webkit-text-stroke:2.5px var(--gold);paint-order:stroke fill;text-shadow:0 10px 34px rgba(0,0,0,.55)}
.c-price span{display:inline-block}
.c-price .dt{font-size:.52em}
.chicha.is-current .c-price span,.chicha.is-current .c-offre{animation:emerge 1.5s cubic-bezier(.2,.7,.2,1) .7s both}
.chicha.is-current .c-price .dt{animation-delay:.95s}
@keyframes emerge{0%{opacity:0;filter:blur(20px);transform:translateY(26px) scale(1.14)}100%{opacity:1;filter:blur(0);transform:none}}
.c-stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,3cqw,22px);height:clamp(180px,30cqh,360px);margin-top:10px}
.hk{height:100%;aspect-ratio:300/500;flex:none}
.hookah{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation;overflow:visible;filter:drop-shadow(0 18px 20px rgba(0,0,0,.45))}
.c-plus{align-self:center;font:400 46px/1 var(--f-poster);color:var(--gold);text-shadow:0 4px 14px rgba(0,0,0,.5)}
.c-cup{position:relative;align-self:center;width:min(38cqw,188px);aspect-ratio:1;flex:none}
.c-cup svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transform:translateY(14px) scale(.9);filter:blur(6px);transition:opacity .5s,transform .5s,filter .5s;pointer-events:none}
.c-cup svg.on{opacity:1;transform:none;filter:none}
.c-hint{position:absolute;right:2px;top:-8px;z-index:4;padding:.25em .9em;border-radius:99px;background:rgba(0,0,0,.45);font:500 11px var(--f-sans);letter-spacing:.2em;text-transform:uppercase;color:#f1e3cc;white-space:nowrap;pointer-events:none;transition:opacity .5s;animation:pulse 2s ease-in-out infinite}
.c-hint.gone{opacity:0;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,154,45,.5)}50%{box-shadow:0 0 0 9px rgba(227,154,45,0)}}
.c-pick{margin:14px auto 0;display:inline-flex;align-items:center;gap:10px;padding:5px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.c-pick button{padding:.55em 1.25em;border-radius:99px;font:500 14px var(--f-sans);letter-spacing:.04em;transition:background .25s,color .25s}
.c-pick button[aria-pressed="true"]{background:var(--gold);color:#241a0e}
.c-pick span{font:italic 500 16px var(--f-didone);color:#e8d9c1}
.c-offered{margin:.2em 0 0;font:400 clamp(38px,min(13cqw,6.4cqh),68px)/1 var(--f-poster);letter-spacing:.02em;text-transform:uppercase;transform:skewX(-8deg);background:linear-gradient(180deg,#ffffff 0%,#f3d9a4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.c-valid{margin:.2em 0 0;font:300 15px var(--f-sans);color:#e4d6c2}
.c-back{margin:1.1em auto 0;display:inline-block;padding:.6em 1.4em;border-radius:99px;border:1px solid rgba(255,255,255,.4);font:500 12px var(--f-sans);letter-spacing:.2em;text-transform:uppercase;transition:background .25s}
.c-back:hover{background:rgba(255,255,255,.12)}
.coal{animation:flick 1.2s ease-in-out infinite alternate}
.coal-glow{animation:flick 1.7s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.7}to{opacity:1}}
.hookah.is-puff .coal,.hookah.is-puff .coal-glow{opacity:1;animation:none;filter:brightness(1.5)}
.bub{transform-box:fill-box;transform-origin:center;animation:rise 3.4s ease-in infinite}

const compactLandscape = innerWidth > innerHeight && innerHeight < 500;
function splitSection(section){
  if(!section.groups) return [section];

  const budget = compactLandscape ? 6.4 : innerWidth <= 360 ? 7 : section.feature ? 9.8 : 10.5;
  const chunks = [];
  let groups = [], weight = 0;
  const finishChunk = () => {
    if(groups.length) chunks.push(groups);
    groups = [];
    weight = 0;
  };
  for(const group of section.groups){
    for(const item of group.items){
      const description = item[2] || '';
      const itemWeight = 1 + Math.ceil(item[0].length/35)*.25 + Math.ceil(description.length/42)*.55 + (item[3] ? .3 : 0);
      const startsGroup = !groups.length || groups[groups.length-1].name !== group.name;
      const groupWeight = startsGroup ? 1 : 0;
      if(groups.length && weight + groupWeight + itemWeight > budget) finishChunk();
      const nextGroup = groups[groups.length-1];
      if(!nextGroup || nextGroup.name !== group.name) groups.push({name:group.name,items:[]});
      groups[groups.length-1].items.push(item);
      weight += (groups[groups.length-1].items.length === 1 ? 1 : 0) + itemWeight;
    }
  }
  finishChunk();

  return chunks.map((pageGroups,index) => ({
    ...section,
    id:index===0 ? section.id : `${section.id}-suite-${index+1}`,
    sectionId:section.id,
    label:index===0 ? section.label : `${section.label} (suite ${index+1})`,
    kicker:index===0 ? section.kicker : `${section.kicker} · suite`,
    groups:pageGroups,
    lede:index===0 ? section.lede : undefined,
    feature:index===chunks.length-1 ? section.feature : undefined,
    note:index===chunks.length-1 ? section.note : undefined,
    sectionStart:index===0,
    continuation:index>0
  }));

function makeFace(i, side){

  s.setAttribute('aria-label',`Page ${i+1} sur ${N} : ${pg.label}`);
  let html='';
  if(pg.type==='cover') html=cover();
  else if(pg.type==='photo') html=photo();
  else if(pg.type==='toc') html=toc(pg,i);
  else if(pg.type==='noir') html=noir(pg,i);
  else if(pg.type==='paper') html=paperPage(pg,i);
  else if(pg.type==='poster'){ const r=poster(pg,i); s.setAttribute('style',r.style); html=r.html; }
  else html=chicha();
  s.innerHTML=html;
  const menuArt = MENU_ART[pg.sectionId || pg.id];
  if(menuArt){
    const art = document.createElement('img');

    art.alt = '';
    art.setAttribute('aria-hidden','true');
    art.draggable = false;
    s.appendChild(art);
  }
  return s;
}

function makeSprite(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,248,240,.95)');r.addColorStop(.4,'rgba(255,248,240,.36)');r.addColorStop(1,'rgba(255,248,240,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return c}

class Smoke{
  constructor(host,cv,anchorEl){this.host=host;this.cv=cv;this.ctx=cv.getContext('2d');this.anchorEl=anchorEl;this.ps=[];this.sp=[];this.run=false;this.last=0;this.t0=0;this.w=0;this.h=0;this.d=1;this.spr=makeSprite();this.ptr={x:-999,y:-999,vx:0,vy:0};this.tick=this.tick.bind(this)}
  size(){const w=this.cv.clientWidth,h=this.cv.clientHeight;if(!w||!h)return false;const d=Math.min(devicePixelRatio||1,2);if(this.cv.width!==Math.round(w*d)||this.cv.height!==Math.round(h*d)){this.cv.width=Math.round(w*d);this.cv.height=Math.round(h*d)}this.d=d;this.w=w;this.h=h;return true}
  // layout-space position of the coal (immune to the 3D transforms)
  origin(){
    const el=this.anchorEl; let x=0,y=0,n=el;
    while(n && n!==this.host){ x+=n.offsetLeft; y+=n.offsetTop; const op=n.offsetParent; if(op && op!==this.host){ x-=op.scrollLeft; y-=op.scrollTop; } n=op; }
    return {x: x + el.offsetWidth*(110/300), y: y + el.offsetHeight*(28/500)};
  }
  puff(o,big){if(this.ps.length>150)return;this.ps.push({x:o.x+(Math.random()-.5)*12,y:o.y,r:big?18+Math.random()*16:9+Math.random()*8,g:big?.9+Math.random()*.7:.45+Math.random()*.4,vy:big?1.1+Math.random()*1.1:.55+Math.random()*.55,vx:(Math.random()-.5)*(big?1.7:.3),a:big?.22:.14,age:0,life:(big?300:240)+Math.random()*80,seed:Math.random()*6.28,k:.02+Math.random()*.02})}
  spark(o){this.sp.push({x:o.x+(Math.random()-.5)*50,y:o.y+2,vx:(Math.random()-.5)*.5,vy:-(.8+Math.random()*1.2),age:0,life:50+Math.random()*50})}
  burst(){const o=this.origin();for(let i=0;i<24;i++)this.puff(o,true);for(let i=0;i<12;i++)this.spark(o)}
  step(dt,emit){
    if(emit){const o=this.origin();if(Math.random()<.6*dt)this.puff(o,false);if(Math.random()<.08*dt)this.spark(o)}
    const q=this.ptr;
    for(const p of this.ps){p.age+=dt;const u=p.age/p.life;p.y-=p.vy*dt*(1-.45*u);p.x+=(Math.sin(p.age*p.k*2+p.seed)*.6+p.vx*(1-u))*dt;p.r+=p.g*dt*.35;
      const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);if(d<120){const f=1-d/120;p.x+=(q.vx*.35+dx/(d||1)*1.2)*f;p.y+=q.vy*.35*f}}
    this.ps=this.ps.filter(p=>p.age<p.life);
    for(const s of this.sp){s.age+=dt;s.x+=s.vx*dt+Math.sin(s.age*.2)*.2;s.y+=s.vy*dt}
    this.sp=this.sp.filter(s=>s.age<s.life);
    q.vx*=.88;q.vy*=.88;
  }
  draw(){const x=this.ctx;x.setTransform(this.d,0,0,this.d,0,0);x.clearRect(0,0,this.w,this.h);
    for(const p of this.ps){const u=Math.min(1,p.age/p.life);x.globalAlpha=p.a*Math.pow(Math.sin(Math.PI*u),.8);x.drawImage(this.spr,p.x-p.r,p.y-p.r,p.r*2,p.r*2)}
    x.globalAlpha=1;for(const s of this.sp){const u=s.age/s.life;x.fillStyle=`rgba(255,${150+Math.round(60*(1-u))},60,${(1-u)*.9})`;x.beginPath();x.arc(s.x,s.y,1.3,0,6.28);x.fill()}}
  tick(t){if(!this.run)return;const dt=Math.min(40,t-this.last)/16.67;this.last=t;this.step(dt,t>this.t0);this.draw();requestAnimationFrame(this.tick)}
  start(){if(!this.size())return;if(reduced){this.ps=[];for(let i=0;i<110;i++)this.step(1,true);this.draw();return}if(this.run)return;this.run=true;this.last=performance.now();this.t0=this.last+900;requestAnimationFrame(this.tick)}
  stop(){this.run=false}
}

  const x = (e.clientX - r.left)*kx, y = (e.clientY - r.top)*ky, seen = q.x > -900;
  q.vx = seen ? Math.max(-30,Math.min(30,x - q.x)) : 0; q.vy = seen ? Math.max(-30,Math.min(30,y - q.y)) : 0; q.x = x; q.y = y;

/* ================= LAYOUT + 3D STATE ================= */
let wide = false, pw = 0, ph = 0, p = 0, f = 0, visPrev = new Set();

function layout(){
  const W = innerWidth, H = innerHeight;
  if(compactLandscape){
    wide = true;
    pw = Math.round(Math.min((W-24)/2,460));
    ph = H-76;
    stage.style.setProperty('--pw', pw+'px');
    stage.style.setProperty('--ph', ph+'px');
    stage.classList.add('is-wide');
    tilt.style.removeProperty('--tx'); tilt.style.removeProperty('--ty');
    return;
  }
  let w = Math.min((H-118)*0.68, (W-56)/2, 560), h = w/0.68;
  wide = w >= 290 && h >= 640;
  if(!wide){ w = Math.min(W-24, 500); h = Math.max(300, Math.min(H-112, w*1.95)); }
  pw = Math.round(w); ph = Math.round(h);
  stage.style.setProperty('--pw', pw+'px');
  stage.style.setProperty('--ph', ph+'px');
  stage.classList.toggle('is-wide', wide);
  tilt.style.removeProperty('--tx'); tilt.style.removeProperty('--ty');
}

function render(prevF, instant){
  if(instant) stage.classList.add('no-anim');
  stage.classList.toggle('is-front', f===0);
  const fwd = f > prevF, span = Math.abs(f - prevF);
  leaves.forEach((lf,k)=>{
    const flipped = k < f;
    let d = 0;
    if(!instant && span>1){
      if(fwd && k>=prevF && k<f) d = (k-prevF)*85;
      if(!fwd && k>=f && k<prevF) d = (prevF-1-k)*85;
    }
    lf.style.setProperty('--d', d+'ms');
    lf.classList.toggle('flipped', flipped);
    lf.style.transform = `translateZ(${flipped ? (k+1)*2 : (LEAVES-k)*2}px) rotateY(${flipped ? -180 : 0}deg)`;
  });

  let shift;
  if(f===0) shift = -pw/2;
  else if(wide) shift = 0;
  else shift = (p%2===1) ? pw/2 : -pw/2;
  world.style.setProperty('--shift', shift+'px');
  world.style.setProperty('--sw', ((wide && f>0) ? pw*1.8 : pw*0.92)+'px');
  book.style.setProperty('--nr', LEAVES - f);
  book.style.setProperty('--nl', f);

  const vis = new Set();
  if(wide){ if(f>=1) vis.add(2*f-1); if(2*f<N) vis.add(2*f); } else vis.add(p);
  faces.forEach((el,i)=>{
    const v = vis.has(i);
    el.classList.toggle('is-current', v);
    el.inert = !v;
    el.setAttribute('aria-hidden', String(!v));
    if(v && !visPrev.has(i)){ const sc = el.querySelector('.scroll'); if(sc) sc.scrollTop = 0; }
  });
  visPrev = vis;
  if(vis.has(IDX['offre-chicha'])) smoke.start(); else smoke.stop();

  try{ history.replaceState(null,'','#'+PAGES[p].id); }catch(e){}
  if(instant){ void stage.offsetWidth; requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('no-anim'))); }
}

function setPage(np, instant){
  np = Math.max(0, Math.min(N-1, np));
  const prevF = f;
  p = np; f = Math.ceil(p/2);
  if(!instant && p===np && f===prevF && visPrev.has(np) && !wide && false) return;
  render(prevF, instant);
}
const next = () => { if(wide){ if(f<MAXF) setPage(2*(f+1)-1); } else setPage(p+1); };
const prev = () => { if(wide){ if(f>0) setPage(f===1 ? 0 : 2*(f-1)-1); } else setPage(p-1); };

stage.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if(t && t.dataset.go in IDX) setPage(IDX[t.dataset.go]); });
document.addEventListener('keydown', e => { if(e.key==='ArrowRight') next(); else if(e.key==='ArrowLeft') prev(); });

let sx=0, sy=0, tracking=false;
stage.addEventListener('pointerdown', e => { if(e.target.closest('button,a')) return; sx=e.clientX; sy=e.clientY; tracking=true; });
stage.addEventListener('pointerup', e => {
  if(!tracking) return; tracking=false;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>46 && Math.abs(dx)>Math.abs(dy)*1.4){ dx<0 ? next() : prev(); }
});
stage.addEventListener('pointercancel', () => { tracking=false; });
stage.addEventListener('pointermove', e => {
  if(!wide || e.pointerType!=='mouse' || reduced) return;
  const nx = e.clientX/innerWidth - .5, ny = e.clientY/innerHeight - .5;
  tilt.style.setProperty('--ty', (-3 + nx*9)+'deg');
  tilt.style.setProperty('--tx', (15 - ny*6)+'deg');
});
addEventListener('hashchange', () => { const id = location.hash.slice(1); if(id in IDX && IDX[id]!==p) setPage(IDX[id]); });
addEventListener('resize', () => {
  if((innerWidth>innerHeight && innerHeight<500)!==compactLandscape){ location.reload(); return; }
  layout(); render(f, true);
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden) smoke.stop();
  else if(visPrev.has(IDX['offre-chicha'])) smoke.start();
});

layout();
const startId = location.hash.slice(1);
setPage(startId in IDX ? IDX[startId] : IDX['bienvenue'], true);
})();
</script>
</body>
